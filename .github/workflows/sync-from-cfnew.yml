name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

permissions:
  contents: write  # 需要把同步结果 push 回仓库

# 定时和手动可能撞在一起，排队跑，别并发 push
concurrency:
  group: sync-from-cfnew
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取 cfnew 最新发布
        id: get_latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 认证调用，避开未登录 60 次/小时的 IP 限额
        run: |
          set -euo pipefail

          # 统一出口：带 token、带重试、带状态码检查
          fetch() {
            curl -sS --retry 4 --retry-delay 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$2" "$1"
          }

          echo "正在获取最新发布信息..."
          fetch "https://api.github.com/repos/byJoey/cfnew/releases/latest" release.json

          # 先确认拿到的是合法 JSON，坏了就把原文打印出来，方便下次直接看原因
          if ! python3 -c 'import json; json.load(open("release.json"))' 2>/dev/null; then
            echo "错误：GitHub API 没有返回合法 JSON，原始响应如下："
            head -c 800 release.json || true
            exit 1
          fi

          VERSION=$(python3 -c 'import json; print(json.load(open("release.json")).get("tag_name") or "")')
          if [ -z "$VERSION" ]; then
            echo "错误：返回体里没有 tag_name"
            head -c 800 release.json || true
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "最新版本: $VERSION"

          # latest 的返回体里已经内联了 assets 列表，不用再请求一次
          FILE_NAME="Pages.zip"
          echo "正在查找 ${FILE_NAME} ..."
          DOWNLOAD_URL=$(python3 -c 'import json;print(next((a["browser_download_url"] for a in (json.load(open("release.json")).get("assets") or []) if a.get("name","").lower().endswith("pages.zip")),""))' release.json)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "错误：未找到 ${FILE_NAME} 文件"
            echo "可用的文件列表："
            python3 -c 'import json;[print("  - " + a.get("name","")) for a in (json.load(open("release.json")).get("assets") or [])]' release.json
            exit 1
          fi

          rm -f release.json
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "下载 URL: $DOWNLOAD_URL"
          echo "文件名: $FILE_NAME"

      - name: 检查当前版本
        id: check_version
        run: |
          # 读取当前记录的版本，如果文件不存在则创建空文件
          if [ ! -f "VERSION.txt" ]; then
            echo "未找到版本记录文件，创建新文件"
            touch VERSION.txt
            CURRENT_VERSION=""
          else
            CURRENT_VERSION=$(cat VERSION.txt | tr -d '\n\r ')
            if [ -z "$CURRENT_VERSION" ]; then
              echo "版本记录文件为空，将进行首次更新"
            else
              echo "当前记录的版本: $CURRENT_VERSION"
            fi
          fi

          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # 如果版本文件不存在或为空，或者版本不同，则需要更新
          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将下载文件并创建版本记录"
            else
              echo "发现新版本 $CURRENT_VERSION -> $NEW_VERSION，需要更新"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          else
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          fi

      - name: 下载并更新文件
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：未找到可下载的文件"
            exit 1
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "错误：未获取到版本号"
            exit 1
          fi

          echo "正在下载文件: $FILE_NAME"
          curl -fL --retry 3 --retry-delay 5 --retry-all-errors -o "$FILE_NAME" "$DOWNLOAD_URL"

          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：下载失败"
            exit 1
          fi

          echo "下载成功: $FILE_NAME"

          # 解压缩 Pages.zip
          echo "正在解压缩 $FILE_NAME..."
          unzip -o "$FILE_NAME" -d .

          if [ $? -ne 0 ]; then
            echo "错误：解压缩失败"
            exit 1
          fi

          echo "解压缩成功"

          # 删除 zip 文件（可选，如果不需要保留）
          rm -f "$FILE_NAME"
          echo "已删除压缩文件: $FILE_NAME"

          # 确保创建或更新版本记录文件
          if [ ! -f "VERSION.txt" ]; then
            echo "创建版本记录文件"
            touch VERSION.txt
          fi

          # 写入版本号
          echo "$VERSION" > VERSION.txt
          echo "版本记录已创建/更新: $VERSION"

          # 验证文件是否成功写入
          if [ -f "VERSION.txt" ] && [ -s "VERSION.txt" ]; then
            echo "✓ 版本记录文件创建成功"
          else
            echo "✗ 警告：版本记录文件可能未正确创建"
          fi

      - name: 提交并推送更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A

          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 输出摘要
        run: |
          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo "- 最新版本: ${{ steps.get_latest.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 当前版本: ${{ steps.check_version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "- 状态: ✅ 已更新到新版本" >> $GITHUB_STEP_SUMMARY
            echo "- 下载文件: ${{ steps.get_latest.outputs.file_name }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ⏭️ 版本相同，无需更新" >> $GITHUB_STEP_SUMMARY
          fi